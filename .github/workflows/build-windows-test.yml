name: Windows Test Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: local-download-god-pipeline

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Install dependencies
        shell: powershell
        run: npm ci

      - name: Build application
        shell: powershell
        run: npm run build

      - name: Package Windows installer
        shell: powershell
        run: npm run dist:win

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: GODSend-360v2-Windows-Test
          path: |
            dist/*.exe
            dist/*.blockmap
          if-no-files-found: error
          retention-days: 14
